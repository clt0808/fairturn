# Render Blueprint for FairTurn.
# Create the service from this file. Render will ask for ADMIN_PASSWORD.
# Do not set SEED_DEMO. Sample links must not load on the public site.
services:
  - type: web
    name: fairturn
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: fairturn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/fairturn.db
      - key: SEED_DEMO
        value: "false"
